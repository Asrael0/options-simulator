[project]
name = "options-simulator"
version = "0.1.0"
description = "Options simulator: pricing, Greeks, multi-leg payoff, real option chains and a virtual portfolio"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "nicegui>=3.15.0",
    "numpy>=2.5.1",
]

[project.scripts]
options-simulator = "options_simulator.app:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# -q = compact output. --strict-markers reports misspelled markers instead of
# silently ignoring them.
addopts = "-q --strict-markers"

# ---------------------------------------------------------------------------
# mypy — the Python equivalent of "TypeScript strict mode"
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
# Without this, a function left without annotations would pass silently.
disallow_untyped_defs = true
warn_unreachable = true
show_error_codes = true

# ---------------------------------------------------------------------------
# ruff — linter and formatter in a single tool.
# It replaces black, isort, flake8 and others: one dependency instead of four.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
# py313 rather than py314: with py314 the formatter drops the parentheses from
# `except (A, B):` (PEP 758). That is valid in 3.14, but many editors and tools
# still flag it as a syntax error.
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes: undefined names, unused imports
    "I",    # isort: import order
    "N",    # pep8-naming
    "UP",   # pyupgrade: modern syntax
    "B",    # bugbear: common pitfalls
    "SIM",  # simplifications
    "RUF",  # ruff's own rules
]
ignore = [
    # RUF001/RUF002 flag "ambiguous" Unicode characters inside strings and
    # docstrings: a defence against homoglyphs used to hide code. Here those
    # characters are deliberate, user-facing typography: ν and ρ ARE vega and
    # rho, × IS the multiplication sign, − IS the minus sign. Replacing them
    # with Latin letters would make the interface worse.
    # RUF003 stays on: comments do not need that typography.
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
# In tests the "magic numbers" are the point: they are the expected values.
"tests/*" = ["E501"]
# The guide is almost all Markdown prose inside strings: breaking table rows
# to fit the line length would make the source unreadable without improving
# anything.
"src/options_simulator/app/pages/guide.py" = ["E501"]
"src/options_simulator/app/pages/guide_en.py" = ["E501"]
