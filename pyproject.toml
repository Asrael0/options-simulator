[project]
name = "options-simulator"
version = "0.1.0"
description = "Simulatore di opzioni: pricing, greche, payoff multi-gamba, opzioni reali e portafoglio virtuale"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "nicegui>=3.15.0",
    "numpy>=2.5.1",
]

[project.scripts]
options-simulator = "options_simulator.app:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# -q = output compatto. --strict-markers segnala i marker scritti male invece
# di ignorarli in silenzio.
addopts = "-q --strict-markers"

# ---------------------------------------------------------------------------
# mypy — l'equivalente Python di "TypeScript strict mode"
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
# Senza questo, una funzione dimenticata senza annotazioni passerebbe muta.
disallow_untyped_defs = true
warn_unreachable = true
show_error_codes = true

# ---------------------------------------------------------------------------
# ruff — linter e formattatore in un solo strumento.
# Sostituisce black, isort, flake8 e altri: una dipendenza invece di quattro.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
# py313 e non py314: con py314 il formattatore toglie le parentesi da
# `except (A, B):` (PEP 758). È valido in 3.14, ma molti editor e strumenti
# lo segnalano ancora come errore di sintassi.
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes: nomi non definiti, import inutilizzati
    "I",    # isort: ordine degli import
    "N",    # pep8-naming
    "UP",   # pyupgrade: sintassi moderna
    "B",    # bugbear: trappole comuni
    "SIM",  # semplificazioni
    "RUF",  # regole proprie di ruff
]
ignore = [
    # RUF001/RUF002 segnalano caratteri Unicode "ambigui" dentro stringhe e
    # docstring: è una difesa contro gli omoglifi usati per nascondere codice.
    # Qui i caratteri incriminati sono tipografia voluta e rivolta all'utente:
    # ν e ρ SONO vega e rho, × È il segno di moltiplicazione, − È il meno.
    # Sostituirli con lettere latine peggiorerebbe l'interfaccia.
    # RUF003 resta attiva: nei commenti quella tipografia non serve.
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
# Nei test i "magic number" sono il punto: sono i valori attesi.
"tests/*" = ["E501"]
# La guida è quasi tutta prosa in Markdown dentro stringhe: spezzare le righe
# di una tabella per rispettare la lunghezza massima renderebbe il testo
# illeggibile nel sorgente senza migliorare nulla.
"src/options_simulator/app/pages/guide.py" = ["E501"]
